[project]
name = "castrol-pipeline"
version = "0.1.0"
description = "Castrol MAGNATEC mechanic promo video pipeline - batch video factory"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "boto3>=1.34",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "pillow>=10.3",
    "tenacity>=8.3",
    "typer>=0.12",
]

[project.scripts]
castrol = "castrol_pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/castrol_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
